<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Seasonal Crop Advisor</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f1df,
                    #dce8d5
                );
        }

        .login-container {

            width: 390px;

            padding: 40px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);

        }

        .logo {

            text-align: center;

            font-size: 48px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            color: #234d32;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #357a4b;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2e6b3f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #245631;
        }

        .error {

            background: #ffe5e5;

            color: #b00020;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2e6b3f;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">🌱</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Seasonal Crop Advisor
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('admin_login') }}">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <a href="{{ url_for('home') }}?skip_splash=1#prediction"
           class="back">

            ← Back to Crop Advisor

        </a>

    </div>

</body>

</html>
